<!DOCTYPE html>
<html data-bs-theme="light">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TwistedMail</title>
        <!-- Bootstrap code -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js" integrity="sha512-TPh2Oxlg1zp+kz3nFA0C5vVC6leG/6mm1z9+mA81MI5eaUVqasPLO8Cuk4gMF4gUfP5etR73rgU/8PNMsSesoQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>

    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-expand-lg sticky-top bg-body py-4">
            <div class="container justify-content-center">
                <a class="navbar-brand" href="/"><h1>TwistedMail</h1></a>
            </div>
        </nav>

        <main class="flex-grow-1 container-lg h-100 px-2 d-flex align-items-center">
            <div class="d-flex flex-column align-items-center w-100">
                <div id="bodymain">
                    <p><i>Loading...</i></p>
                </div>
            </div>
        </main>

        <footer>
            <div class="text-center text-muted p-4">
                Get it twisted! © 2026
              </div>
        </footer>

        <script>
            async function load_loginpage ()
            {
                const resp = await fetch ("{% url 'login-partial' %}");
                const result = await resp.text();
                
                // Below is unsafe, relies on server-side templating
                const bodymain = document.getElementById("bodymain");
                bodymain.innerHTML = result;

                document.getElementById("login_form").addEventListener("submit", async (event) =>
                {
                    event.preventDefault();

                    const form = event.target;
                    const button = event.submitter;
                    const response = await fetch (form.action,
                    {
                        method: form.method,
                        body: new FormData(form)
                    });

                    const result = await response.json();
                    if (response.ok)
                    {
                        sessionStorage.setItem("bearerToken", result["token"])
                        location.reload();
                    }
                    else
                    {
                        const errors = result.errors.join("<br>")
                        var popover = new bootstrap.Popover(button, {
                            content: errors,
                            html: true,
                            customClass: "border-danger",
                            placement: "right",
                        });
                        popover.show();
                    }
                });
            }

            async function load_emails () 
            {
                const resp = await fetch ("{% url 'emails-partial' %}", {headers: {Authorization: `Bearer ${sessionStorage.getItem("bearerToken")}`}});
                const result = await resp.text();
                
                // Below is unsafe, relies on server-side templating
                const bodymain = document.getElementById("bodymain");
                bodymain.innerHTML = result;
            }
            
            if (sessionStorage.getItem("bearerToken")) {
                // Logged in
                load_emails();
            }
            else {
                // Needs to authenticate
                load_loginpage();
            }
        </script>

    </body>
</html>
