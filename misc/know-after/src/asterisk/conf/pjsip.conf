; ---------------------------------------------------------------------------
; SocEngLLM lab PBX - PJSIP configuration
;
; Topology (dev): softphone  --SIP/RTP-->  the Mac (127.0.0.1 or its
; Tailscale/LAN IP)  --Docker NAT-->  this container. Docker Desktop cannot
; route to container IPs, so we advertise ONE host address in SIP/SDP and rely
; on symmetric RTP / rport / contact rewriting (the standard "behind NAT"
; recipe). local_net is deliberately NOT set so that address is always used.
;
; __EXTERNAL_ADDRESS__ is substituted at container start from the
; EXTERNAL_ADDRESS environment variable (see docker-compose.yml and
; scripts/asterisk-up.sh). Use the Tailscale IP to test from a phone on your
; tailnet; the Mac can reach its own Tailscale IP too, so a local softphone
; keeps working.
;
; When you move to a real SIP trunk: set EXTERNAL_ADDRESS to the public IP
; (or hostname), add local_net for your LAN, and add a trunk endpoint whose
; context is also `inbound`.
; ---------------------------------------------------------------------------

[global]
type = global
user_agent = SocEngLLM-PBX
; identifier order left at the default so the outbound-registration "line"
; identifier (trunk calls) and the anonymous fallback both get a turn.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = __EXTERNAL_ADDRESS__
external_signaling_address = __EXTERNAL_ADDRESS__

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
external_media_address = __EXTERNAL_ADDRESS__
external_signaling_address = __EXTERNAL_ADDRESS__

; ---- trunk transport -----------------------------------------------------
; Separate UDP port so the trunk can advertise the PUBLIC address while the
; softphone transport above advertises the Tailscale/loopback one. Forward
; UDP 5080 and 10000-10010 on your router to this Mac for a guaranteed path;
; without forwarding it still usually works thanks to the registration
; pinhole + symmetric RTP ("NAT: yes" on the VoIP.ms sub-account).
[transport-trunk]
type = transport
protocol = udp
bind = 0.0.0.0:5080
external_media_address = __TRUNK_EXTERNAL_ADDRESS__
external_signaling_address = __TRUNK_EXTERNAL_ADDRESS__

; ---- template shared by every softphone / trunk --------------------------
[nat-endpoint](!)
type = endpoint
context = inbound
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
language = en

; ---- dev accounts ---------------------------------------------------------
; Register a softphone with:
;   server/domain: 127.0.0.1 (same Mac) or the Mac's Tailscale IP (phone)
;   user: caller or phone   password: (below)
[caller](nat-endpoint)
auth = caller-auth
aors = caller
callerid = "CTF Participant" <1001>

[caller-auth]
type = auth
auth_type = userpass
username = caller
password = ctf-caller-2026

[caller]
type = aor
max_contacts = 5
remove_existing = yes

; Second account so a mobile softphone on the tailnet shows up with its own
; caller ID. Same dialplan.
[phone](nat-endpoint)
auth = phone-auth
aors = phone
callerid = "Mobile Tester" <1002>

[phone-auth]
type = auth
auth_type = userpass
username = phone
password = ctf-phone-2026

[phone]
type = aor
max_contacts = 5
remove_existing = yes

; ===========================================================================
; VoIP.ms trunk (values come from .env via docker-compose -> entrypoint.sh)
;   sub-account __TRUNK_USER__ on __TRUNK_HOST__, DID __TRUNK_DID__
; We only receive calls. Registration keeps the NAT pinhole open and, via
; line=yes, lets Asterisk match inbound INVITEs to this endpoint without
; knowing the provider's IP (Docker's NAT hides it anyway).
; ===========================================================================
[voipms-auth]
type = auth
auth_type = userpass
username = __TRUNK_USER__
password = __TRUNK_PASSWORD__

[voipms]
type = aor
contact = sip:__TRUNK_HOST__:5060
qualify_frequency = 30

[voipms]
type = endpoint
transport = transport-trunk
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
outbound_auth = voipms-auth
aors = voipms
from_user = __TRUNK_USER__
from_domain = __TRUNK_HOST__
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
language = en

[voipms-reg]
type = registration
transport = transport-trunk
outbound_auth = voipms-auth
server_uri = sip:__TRUNK_HOST__
client_uri = sip:__TRUNK_USER__@__TRUNK_HOST__
contact_user = __TRUNK_USER__
retry_interval = 30
forbidden_retry_interval = 300
max_retries = 10000
expiration = 120
line = yes
endpoint = voipms

; Anything that reaches us unauthenticated and unmatched (e.g. a provider
; INVITE that lost the line parameter) still lands on the persona.
[anonymous]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
