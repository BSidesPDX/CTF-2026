; ---------------------------------------------------------------------------
; SocEngLLM dialplan
;
;   1000  -> the AI persona (AudioSocket to the SocEngLLM app container)
;   600   -> echo test (verifies the RTP path before involving the AI)
;   601   -> playback test (verifies one-way audio + codecs)
;
; Both softphone calls and (later) SIP-trunk calls land in [inbound].
; A trunk DID can simply Goto(inbound,1000,1).
; ---------------------------------------------------------------------------
[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
; Where the SocEngLLM app listens. host.docker.internal is the macOS host
; as seen from inside Docker Desktop. If you run Asterisk natively, use
; 127.0.0.1:9092.
AUDIOSOCKET_SERVER = __AUDIOSOCKET_SERVER__   ; rendered by entrypoint.sh (app:9092 in compose)

[inbound]
; Privacy: caller ID and the dialled number are never logged or written anywhere, by design.
; Do not add ${CALLERID(...)} or ${EXTEN} to NoOp/Verbose/System lines, and keep CDR/CEL off (cdr.conf, cel.conf).
exten => 1000,1,NoOp(SocEngLLM inbound call)
 same => n,Answer()
 same => n,Wait(0.3)
 ; func_uuid is not shipped in the Ubuntu build, so mint a UUID via the kernel.
 same => n,Set(CALL_UUID=${FILTER(0-9a-f\-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,Set(CHANNEL(hangup_handler_push)=hangup-log,s,1)
 same => n,NoOp(AudioSocket uuid=${CALL_UUID} -> ${AUDIOSOCKET_SERVER})
 same => n,AudioSocket(${CALL_UUID},${AUDIOSOCKET_SERVER})
 same => n,NoOp(AudioSocket ended: ${AUDIOSOCKET_STATUS})
 same => n,Hangup()

exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; Anything else: fast busy.
exten => _X.,1,NoOp(Unknown extension)
 same => n,Congestion(3)
 same => n,Hangup()

; Calls from the SIP trunk: whatever number they dialled, they get the persona.
[from-trunk]
exten => _X.,1,Goto(inbound,1000,1)
exten => s,1,Goto(inbound,1000,1)
exten => _[a-zA-Z].,1,Goto(inbound,1000,1)

[hangup-log]
exten => s,1,NoOp(Call ${CALL_UUID} hung up after ${ANSWEREDTIME}s)
 same => n,Return()

; CLI smoke test:  asterisk -rx "channel originate Local/s@tests application Echo"
[tests]
exten => s,1,Set(U=${FILTER(0-9a-f\-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,NoOp(UUIDTEST=[${U}] len=${LEN(${U})})
 same => n,Hangup()
