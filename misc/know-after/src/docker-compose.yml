# The whole stack: Asterisk (SIP trunk + AudioSocket), the SocEngLLM app, and the web viewer.
#   scripts/asterisk-up.sh            # or: docker compose up -d --build
# Secrets and trunk settings come from .env (compose reads it for ${...} substitution and the
# app services load it with env_file). Nothing secret is baked into an image.
services:
  app:
    build: .
    image: socengllm-app
    container_name: socengllm-app
    restart: unless-stopped
    env_file: .env
    command: ["socengllm", "serve"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./scenarios:/app/scenarios:ro
      - ./sounds:/app/sounds:ro
      - ./bench:/app/bench
      - ./calls:/app/calls
      # - ./models:/app/models  # only for local model backends; an empty mount would hide the baked-in Silero file
    # Not published: only Asterisk needs to reach AudioSocket, over the compose network.
    expose:
      - "9092"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9092), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30          # startup prerenders every greeting/voicemail/system line (~15-30 s)
      start_period: 20s

  web:
    image: socengllm-app
    container_name: socengllm-web
    restart: unless-stopped
    env_file: .env
    command: ["socengllm", "web", "--host", "0.0.0.0", "--port", "8090"]
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./scenarios:/app/scenarios:ro
      - ./sounds:/app/sounds:ro
      - ./bench:/app/bench
      - ./calls:/app/calls
    ports:
      # Localhost only by default: the viewer shows every transcript and its test chats spend API
      # money. Reach it over an SSH tunnel / Tailscale, or set WEB_BIND=0.0.0.0 behind a reverse
      # proxy with auth.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:8090"

  asterisk:
    build: ./asterisk
    container_name: socengllm-asterisk
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy   # don't answer calls before the app can take them
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5080:5080/udp"
      - "10000-10010:10000-10010/udp"
    volumes:
      - ./logs/asterisk:/var/log/asterisk/socengllm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Where the dialplan sends call audio. `app:9092` is the app container above; use
      # host.docker.internal:9092 when running `socengllm serve` on the host for development.
      AUDIOSOCKET_SERVER: ${AUDIOSOCKET_SERVER:-app:9092}
      # Address Asterisk advertises to softphones in SIP/SDP (127.0.0.1 = softphone on this
      # machine only; a Tailscale IP lets phones on the tailnet register). scripts/asterisk-up.sh
      # detects it.
      EXTERNAL_ADDRESS: ${EXTERNAL_ADDRESS:-127.0.0.1}
      # SIP trunk: credentials from .env.
      TRUNK_HOST: ${TRUNK_HOST:-sanjose2.voip.ms}
      TRUNK_USER: ${TRUNK_USER:-}
      TRUNK_PASSWORD: ${TRUNK_PASSWORD:-}
      TRUNK_DID: ${TRUNK_DID:-}
      # Public address advertised to the trunk; auto-detected inside the container when empty.
      TRUNK_EXTERNAL_ADDRESS: ${TRUNK_EXTERNAL_ADDRESS:-}
