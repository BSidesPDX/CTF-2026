---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phone-instance
  labels:
    app: phone-instance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phone-instance
  template:
    metadata:
      labels:
        app: phone-instance
    spec:
      imagePullSecrets:
        - name: "{{ pull_secret }}"
      containers:
        - name: asterisk
          image: registry.digitalocean.com/bsidesctf26-prod/web-mostly-for-appearances-phone-asterisk:prod
          imagePullPolicy: Always
          resources:
            requests: { cpu: 15m, memory: 50Mi }
            # limits: { cpu: 30m, memory: 80Mi }

        - name: employee-answerer
          image: registry.digitalocean.com/bsidesctf26-prod/web-mostly-for-appearances-phone-employee-answerer:prod
          imagePullPolicy: Always

        - name: voip-phone-ui
          image: registry.digitalocean.com/bsidesctf26-prod/web-mostly-for-appearances-phone-ui:prod
          imagePullPolicy: Always
          resources:
            requests: { memory: 50Mi }
            # limits: { memory: 80Mi }
          env:
            - name: SECRET_KEY
              value: "JLQZMhetwPmVU9HoFGp5MuYK3AQ8enXA"
            - name: ANSWERER_HOST
              value: "localhost"  # other container in same pod
            - name: VOIP_EXTENSION
              value: "{{ extension }}"
          ports:
            - containerPort: 9010
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW

        - name: call-triggerer
          image: registry.digitalocean.com/bsidesctf26-prod/web-mostly-for-appearances-phone-call-triggerer:prod
          imagePullPolicy: Always
          resources:
            requests: { memory: 50Mi }
            # limits: { memory: 80Mi }
          ports:
            - containerPort: 8000
          env:
            - name: ASTERISK_SSH_HOST
              value: "localhost"  # other container in same pod
            - name: ASTERISK_SSH_PORT
              value: "22"
            - name: ASTERISK_SSH_USER
              value: "root"
            - name: ASTERISK_SSH_PASSWORD
              value: "root"
            - name: ASTERISK_ORIGINATE_ENDPOINT
              value: "PJSIP/1000"
            - name: ASTERISK_ORIGINATE_EXTENSION
              value: "s@autocall"
            - name: NOTICE_BASE_URL
              value: "http://localhost:8000/notice.wav"
            - name: TOTP_SECRET
              value: 4MUUYXKFDCF4RO37FB3LB5ZP66AKNFBY

---
apiVersion: v1
kind: Service
metadata:
  name: call-triggerer
spec:
  selector:
    app: phone-instance
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: voip-phone-ui
spec:
  selector:
    app: phone-instance
  ports:
    - protocol: TCP
      port: 9010
      targetPort: 9010

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voip-phone-ui
  annotations:
    #cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: beavercds
  tls:
    - hosts:
        - "{{ domain }}"
      secretName: "{{ tls_secret }}"
  rules:
    - host: "{{ domain }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voip-phone-ui
                port:
                  number: 9010
