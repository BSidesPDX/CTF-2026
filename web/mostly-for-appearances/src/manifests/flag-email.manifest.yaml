# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: flag-email-secrets
# type: Opaque
# stringData:
#   SECRET_KEY: ""
#   OAUTH_CLIENT_ID: ""
#   OAUTH_CLIENT_SECRET: ""
#   OAUTH_METADATA_URL: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-email
  labels:
    app: flag-email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-email
  template:
    metadata:
      labels:
        app: flag-email
    spec:
      imagePullSecrets:
        - name: rcds-web-mostly-for-appearances-pull
      containers:
        - name: flag-email
          image: registry.digitalocean.com/bsidesctf26-prod/web-mostly-for-appearances-flag-email:prod
          imagePullPolicy: Always
          resources:
            requests: { cpu: 5m, memory: 80Mi }
          envFrom:
            - secretRef:
                name: flag-email-secrets
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: flag-email
spec:
  selector:
    app: flag-email
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flag-email
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: beavercds
  tls:
    - hosts:
        - webmail.internal.${base_domain}
      secretName: flag-email-tls
  rules:
    - host: webmail.internal.${base_domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flag-email
                port:
                  number: 8080
