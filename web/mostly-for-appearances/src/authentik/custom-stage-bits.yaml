- attrs:
    execution_logging: true
    expression: 'ext = request.context[''flow_plan''].context["prompt_data"]["extension"]


      ak_logger.info(f"triggering call for extension {ext}")


      info_resp = requests.get(f"http://instance-manager:8080/info?ext={ext}")

      info_resp.raise_for_status()

      trigger_url = info_resp.json()["trigger_service"]

      ak_logger.info(f"got trigger service url: {trigger_url}")


      resp = requests.post(trigger_url)

      ak_logger.info(f"got response {resp}")


      ak_message(f"We have called extension {ext} with a verification code.")


      return True'
    name: mfa-trigger-call
  conditions: []
  identifiers:
    pk: 29cadc89-5ee6-43b6-8aba-4b66e653ce78
  model: authentik_policies_expression.expressionpolicy
  permissions: []
  state: present
