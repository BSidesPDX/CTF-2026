RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8

<VirtualHost *:80>
    ServerName voipadmin.tangerineprinting.biz

    ProxyPreserveHost On
    ProxyPass / http://voip-manager:8000/
    ProxyPassReverse / http://voip-manager:8000/

    ErrorLog ${APACHE_LOG_DIR}/voip_error.log
    CustomLog ${APACHE_LOG_DIR}/voip_access.log "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""
</VirtualHost>

<VirtualHost *:80>
    ServerName tangerineprinting.biz
    ServerAlias *
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location "/server-status">
        SetHandler server-status
        Require local
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""
</VirtualHost>
