<!doctype html>
<html>
  <head>
    <title>Cisco VoIP Manager - Remote Connection</title>
    <style>
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        animation: spin 2s linear infinite;
      }
    </style>
  </head>
  <body bgcolor="#FFFFFF">
    <table
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      bgcolor="#003366"
    >
      <tr>
        <td>
          <font size="+2" face="Arial, Helvetica, sans-serif" color="#FFFFFF"
            ><b>&nbsp;CISCO VoIP Manager</b></font
          >
        </td>
        <td align="right">
          <font face="Arial, Helvetica, sans-serif" color="#FFFFFF"
            ><a href="/"><font color="#FFFFFF">Back</font></a> |
            <a href="/logout"><font color="#FFFFFF">Logout</font></a
            >&nbsp;</font
          >
        </td>
      </tr>
    </table>
    <br />
    <font face="Arial, Helvetica, sans-serif"><b>Remote Connection</b></font>
    <hr />

    <table width="100%" border="0" cellpadding="0" cellspacing="0" height="400">
      <tr>
        <td align="center" valign="middle">
          <img
            src="/static/images/logo_plus.png"
            class="loading-spinner"
            alt="Loading..."
          />
          <br /><br />
          <font face="Arial, Helvetica, sans-serif" color="#333333"
            >Remotely connecting to VoIP device Web UI</font
          >
          <br />
          <font
            face="Arial, Helvetica, sans-serif"
            size="-1"
            color="#CC0000"
            id="error-msg"
          ></font>
        </td>
      </tr>
    </table>

    <hr />
    <font size="-1" face="Arial, Helvetica, sans-serif"
      >Copyright &copy; 1999-2005 Cisco Systems, Inc. All rights reserved.</font
    >

    <script>
      const interval = 15 * 1000;
      function checkStatus() {
        fetch("/remote/check")
          .then((response) => response.json())
          .then((data) => {
            if (data.ready) {
              window.location.href = data.phone_url;
            } else if (data.error) {
              document.getElementById("error-msg").textContent = data.error;
            } else {
              setTimeout(checkStatus, interval);
            }
          })
          .catch(() => {
            setTimeout(checkStatus, interval);
          });
      }

      setTimeout(checkStatus, interval);
    </script>
  </body>
</html>
