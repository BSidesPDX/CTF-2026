<!DOCTYPE html>
<html>
<head>
    <title>Cisco VoIP Manager - Device Management</title>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loading-container {
            text-align: center;
            padding: 50px;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
        }
        #phones-table {
            display: none;
        }
    </style>
</head>
<body bgcolor="#FFFFFF">
    <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#003366">
        <tr>
            <td>
                <font size="+2" face="Arial, Helvetica, sans-serif" color="#FFFFFF"><b>&nbsp;CISCO VoIP Manager</b></font>
            </td>
            <td align="right">
                <font face="Arial, Helvetica, sans-serif" color="#FFFFFF">Welcome, {{ current_user.username }} | <a href="{{ url_for('logout') }}"><font color="#FFFFFF">Logout</font></a>&nbsp;</font>
            </td>
        </tr>
    </table>
    <br>
    <font face="Arial, Helvetica, sans-serif"><b>Device Management</b></font>
    <hr>

    <div id="loading" class="loading-container">
        <img src="{{ url_for('static', filename='images/logo_plus.png') }}" class="loading-spinner" alt="Loading...">
        <br>
        <font face="Arial, Helvetica, sans-serif">Loading devices...</font>
    </div>

    <table id="phones-table" border="1" cellpadding="5" cellspacing="0" width="100%" style="font-family: Arial, Helvetica, sans-serif; font-size: small;">
        <tr bgcolor="#CCCCCC">
            <th>MAC Address</th>
            <th>Device Name</th>
            <th>Device Model</th>
            <th>Private IP</th>
            <th>Account Status</th>
            <th>Active Extension</th>
            <th>Options</th>
        </tr>
        <tbody id="phones-body">
        </tbody>
    </table>
    <br>
    <font size="-1" face="Arial, Helvetica, sans-serif">Copyright &copy; 1999-2005 Cisco Systems, Inc. All rights reserved.</font>

    <script>
        function loadPhones() {
            fetch('{{ url_for("get_phones") }}')
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(data => {
                            throw new Error(data.error || 'Error loading devices');
                        });
                    }
                    return response.json();
                })
                .then(phones => {
                    const tbody = document.getElementById('phones-body');
                    tbody.innerHTML = '';

                    phones.forEach(phone => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${phone.mac}</td>
                            <td>${phone.name}</td>
                            <td>${phone.model}</td>
                            <td>${phone.private_ip}</td>
                            <td><font color="${phone.status === 'Online' ? 'green' : '#999999'}">${phone.status}</font></td>
                            <td>${phone.extension}</td>
                            <td align="center">
                                <font size="-1">
                                    ${phone.remote_url ? `<a href="${phone.remote_url}">[Remote]</a>` : `<font color="#999999">[Remote]</font>`}
                                </font>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('phones-table').style.display = 'table';
                })
                .catch(error => {
                    console.error('Error loading phones:', error);
                    document.getElementById('loading').innerHTML = '<font face="Arial, Helvetica, sans-serif" color="red">' + error.message + '</font>';
                });
        }

        window.addEventListener('DOMContentLoaded', loadPhones);
    </script>
</body>
</html>
